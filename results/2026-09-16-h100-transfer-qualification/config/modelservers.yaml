apiVersion: v1
kind: Namespace
metadata:
  name: topology-measurement
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
  namespace: topology-measurement
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prefill
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prefill
        llm-d.ai/guide: topology-measurement
        llm-d.ai/role: prefill
        kubernetes.io/hostname: computeinstance-e00gkcc67a2q47sh2f
    spec:
      nodeSelector:
        kubernetes.io/hostname: computeinstance-e00gkcc67a2q47sh2f
      containers:
      - name: modelserver
        image: docker.io/vllm/vllm-openai:v0.26.0@sha256:770fe65b2c73ee74a5c42165cf3433de4048cc2cd9c57a937ca4e35aba5aa87b
        command:
        - vllm
        - serve
        args:
        - Qwen/Qwen3-8B
        - --revision=b968826d9c46dd6066d109eabc6255188de91218
        - --tokenizer-revision=b968826d9c46dd6066d109eabc6255188de91218
        - --tensor-parallel-size=1
        - --dtype=bfloat16
        - --block-size=64
        - --max-model-len=16384
        - --max-num-seqs=32
        - --max-num-batched-tokens=8192
        - --gpu-memory-utilization=0.85
        - --no-enable-prefix-caching
        - --kv-transfer-config
        - '{"kv_connector": "NixlConnector", "kv_role": "kv_both", "kv_load_failure_policy":
          "fail"}'
        - --port=8000
        ports:
        - name: modelserver
          containerPort: 8000
        - name: nixl
          containerPort: 5600
        env:
        - name: USER
          value: llm-d
        - name: HF_HOME
          value: /cache
        - name: UCX_PROTO_INFO
          value: 'yes'
        - name: UCX_CUDA_IPC_ENABLE_GET_ZCOPY
          value: 'on'
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: VLLM_NIXL_SIDE_CHANNEL_PORT
          value: '5600'
        - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
          value: '120'
        - name: UCX_TLS
          value: tcp,cuda_copy,cuda_ipc,self
        resources:
          requests:
            cpu: '6'
            memory: 32Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '6'
            memory: 48Gi
            nvidia.com/gpu: '1'
        startupProbe:
          httpGet:
            path: /v1/models
            port: modelserver
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health
            port: modelserver
          timeoutSeconds: 5
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: cache
          mountPath: /cache
      terminationGracePeriodSeconds: 30
      volumes:
      - name: shm
        hostPath:
          path: /dev/shm
          type: Directory
      - name: cache
        emptyDir: {}
      hostIPC: true
      hostPID: true
---
